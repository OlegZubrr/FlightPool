<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flights</title>
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/main.css" />
    <link rel="stylesheet" href="../styles/flightsPage.css" />
    <link rel="stylesheet" href="../styles/keyframes.css" />
    <link rel="icon" href="../assets/icon.ico" type="image/x-icon" />
  </head>
  <body data-page="flights">
    <div class="sidebar">
      <h3>Sort By:</h3>
      <ul class="sortParamsUl">
        <li>
          <input type="checkbox" id="speedSortCB" />
          <h4>Speed</h4>
        </li>
        <li>
          <input type="checkbox" id="priceSortCB" />
          <h4>Price</h4>
        </li>
      </ul>
      <h4 id="countOfFlightsHeader">Select 2 flights</h4>
      <ul class="sidebar-flights-container">
        <li>
          <div class="sideBar-flightCard" id="TP122">
            <div class="priceSide">
              <p class="price">252$</p>
              <p class="flight">TP122_2_2</p>
            </div>
            <div class="tripSide">
              <p class="from">Lisbon</p>
              <span class="arrow">&#8594;</span>
              <p class="to">Porto</p>
            </div>
          </div>
          <a class="deleteFromBascetBtn">X</a>
        </li>
      </ul>
    </div>
    <div class="content">
      <h3>Flights</h3>
      <div class="flightsData"></div>
    </div>
    <div class="errorBox" id="mainErrorBox">
      <h4>You have not specified a return date</h4>
    </div>

    <script type="module" src="../scripts/main.js"></script>
  </body>
</html>
